<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="0.6" stop-color="#24283b"/>
      <stop offset="1" stop-color="#3b2f1e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0af68"/>
      <stop offset="1" stop-color="#ffd58a"/>
    </linearGradient>
    <style>
      .title { font: 700 44px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .sub { font: 600 18px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: url(#gold); letter-spacing: 1px; }
      .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
      .fade2 { opacity: 0; animation: fade 1.2s ease-out 0.4s forwards; }
      .wave { animation: drift 8s ease-in-out infinite alternate; }
      .spark { animation: twinkle 2.4s ease-in-out infinite; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-40px); } }
      @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="900" height="200" fill="url(#bg)"/>
  <g class="wave">
    <path d="M0 160 C 150 120, 300 200, 450 160 S 750 120, 940 160 L 940 200 L 0 200 Z" fill="#e0af68" opacity="0.18"/>
    <path d="M0 175 C 170 145, 330 205, 500 175 S 780 145, 940 175 L 940 200 L 0 200 Z" fill="#e0af68" opacity="0.30"/>
  </g>
  <circle class="spark" cx="120" cy="52" r="3" fill="#ffd58a"/>
  <circle class="spark" cx="790" cy="40" r="2.5" fill="#ffd58a" style="animation-delay:0.8s"/>
  <circle class="spark" cx="700" cy="120" r="2" fill="#ffffff" style="animation-delay:1.4s"/>
  <text class="title fade" x="450" y="92" text-anchor="middle">Hi, I'm Xyvan 👋</text>
  <text class="sub fade2" x="450" y="128" text-anchor="middle">ROBLOX GAME DEVELOPER • LUAU &amp; C++ • BLENDER</text>
</svg>
