<svg xmlns="http://www.w3.org/2000/svg" width="900" height="80" viewBox="0 0 900 80">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b2f1e"/>
      <stop offset="0.5" stop-color="#24283b"/>
      <stop offset="1" stop-color="#1a1b27"/>
    </linearGradient>
    <style>
      .wave { animation: drift 8s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-40px); } }
    </style>
  </defs>
  <g class="wave">
    <path d="M0 30 C 170 0, 330 60, 500 30 S 780 0, 940 30 L 940 80 L 0 80 Z" fill="url(#bg)"/>
    <path d="M0 45 C 150 20, 300 70, 450 45 S 750 20, 940 45 L 940 80 L 0 80 Z" fill="#e0af68" opacity="0.2"/>
  </g>
</svg>
